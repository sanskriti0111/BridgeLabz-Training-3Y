<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
    <header class="header">
        <h1>Responsive Image Filter Gallery</h1>
    </header>
    <main class="gallery-container">
        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=1" alt="Blur Filter Image" class="filter-blur">
            <figcaption>Blur Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=2" alt="Grayscale Filter Image" class="filter-grayscale">
            <figcaption>Grayscale Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=3" alt="Sepia Filter Image" class="filter-sepia">
            <figcaption>Sepia Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=4" alt="Brightness Filter Image" class="filter-brightness">
            <figcaption>Brightness Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=5" alt="Contrast Filter Image" class="filter-contrast">
            <figcaption>Contrast Filter</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="https://picsum.photos/400/300?random=6" alt="Hue-Rotate Filter Image" class="filter-huerotate">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </main>
</body>
</html>
