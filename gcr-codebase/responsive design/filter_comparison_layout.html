<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
    <header class="header">
        <h1>Filter Comparison Showcase</h1>
    </header>

    <main class="comparison-container">
        <figure class="img-card">
            <img src="https://picsum.photos/500/350?random=31" alt="Original Image">
            <figcaption>Original Image</figcaption>
        </figure>

        <figure class="img-card">
            <img src="https://picsum.photos/500/350?random=31" alt="Filtered Image" class="filtered-img">
            <figcaption>Filtered (Contrast & Brightness - Hover to Remove)</figcaption>
        </figure>
    </main>
</body>
</html>
