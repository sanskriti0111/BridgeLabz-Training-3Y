<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter_cards_with_animation.css">
</head>
<body>
    <header class="header">
        <h1>Creative Profile Cards</h1>
    </header>

    <main class="card-container">
        <article class="card">
            <img src="https://picsum.photos/300/300?random=11" alt="Profile Image" class="filter-grayscale">
            <h2>Alex Morgan</h2>
            <p>Lead UI Designer crafting responsive interfaces and digital user experiences.</p>
        </article>

        <article class="card">
            <img src="https://picsum.photos/300/300?random=12" alt="Profile Image" class="filter-sepia">
            <h2>Sarah Jenkins</h2>
            <p>Senior Full-Stack Developer specializing in scalable cloud applications.</p>
        </article>

        <article class="card">
            <img src="https://picsum.photos/300/300?random=13" alt="Profile Image" class="filter-hue">
            <h2>David Chen</h2>
            <p>DevOps Engineer focused on build automation and cloud security systems.</p>
        </article>
    </main>
</body>
</html>
